[package]
name = "aqua"
version = "1.0.0"
description = "Aqua — desktop water tracker"
edition = "2021"
license = "MIT"
repository = "https://github.com/kyou0x/drink-water"
publish = false

[lib]
name = "aqua_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sys-locale = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
